<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty deck preview</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="app-frame">
      <main class="app-pane">
        <div class="page-content">
          <div class="page">
            <div class="page-title">
              <div class="deck-hero">
                <a class="page-back" href="#back">Back</a>
                <h1>Test</h1>
                <p class="muted">0 cards · 0 due · 0 learned</p>
              </div>
              <div class="header-actions deck-hero-actions">
                <button class="btn" type="button">Edit Deck</button>
              </div>
            </div>
            <section class="deck-section">
              <div class="deck-section-header">
                <h2 class="section-heading">Deck Details</h2>
              </div>
              <dl class="deck-details-read">
                <div>
                  <dt>Deck Set</dt>
                  <dd>No Set</dd>
                </div>
                <div>
                  <dt>Front Language</dt>
                  <dd>English</dd>
                </div>
                <div>
                  <dt>Back Language</dt>
                  <dd>English</dd>
                </div>
              </dl>
            </section>
            <section class="deck-section">
              <div class="deck-section-header">
                <h2 class="section-heading">Cards</h2>
                <div class="header-actions deck-card-actions">
                  <button class="btn primary" type="button">Add Card</button>
                  <button class="btn" type="button">Import CSV</button>
                </div>
              </div>
              <div class="empty empty-cards">
                <p>This deck has no cards yet.</p>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
