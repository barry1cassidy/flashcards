server {
  listen 80 default_server;
  server_name zipdeck.app www.zipdeck.app _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://zipdeck.app$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.zipdeck.app;

  ssl_certificate /etc/letsencrypt/live/zipdeck.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zipdeck.app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://zipdeck.app$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name zipdeck.app;

  ssl_certificate /etc/letsencrypt/live/zipdeck.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zipdeck.app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;

  root /usr/share/nginx/html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
