services:
  mysql:
    image: mysql:8.4
    container_name: flashcards-mysql
    environment:
      MYSQL_DATABASE: flashcards
      MYSQL_USER: flashcards
      MYSQL_PASSWORD: flashcards
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - flashcards-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  flashcards-mysql:
