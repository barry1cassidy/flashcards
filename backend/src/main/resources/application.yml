spring:
  application:
    name: flashcards
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  config:
    import:
      - optional:file:./google-sso.yml
      - optional:file:./backend/google-sso.yml
      - optional:file:./agent.yml
      - optional:file:./backend/agent.yml
      - optional:file:./stripe.yml
      - optional:file:./backend/stripe.yml
  datasource:
    url: jdbc:mysql://localhost:3306/flashcards?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: flashcards
    password: flashcards
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

logging:
  level:
    com.flashcards.agent: INFO

server:
  port: 8080

app:
  jwt:
    secret: local-dev-only-change-me-to-a-long-random-string-32b
    expiration-ms: 86400000
  billing:
    stub-enabled: ${APP_BILLING_STUB_ENABLED:true}
    public-checkout: ${APP_BILLING_PUBLIC_CHECKOUT:false}
    public-app-url: ${APP_PUBLIC_URL:http://localhost:5173}
    monthly-price-display: "$7.99"
    yearly-price-display: "$39.99"
    addon-price-display: "$2.99"
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      price-monthly: ${STRIPE_PRICE_MONTHLY:}
      price-yearly: ${STRIPE_PRICE_YEARLY:}
      price-addon: ${STRIPE_PRICE_ADDON:}
  agent:
    api-key: ${AGENT_API_KEY:}
    base-url: ${AGENT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${AGENT_MODEL:gemini-3.8-flash}
    monthly-credits: 10
    addon-credits: 10
    max-cards: 40
    timeout-seconds: 90
    max-prompt-chars: 2000
    max-pdf-bytes: 8388608
    max-pdf-pages: 30
    max-pdf-chars: 40000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  card-images:
    storage: ${CARD_IMAGES_STORAGE:local}
    dir: ${CARD_IMAGES_DIR:./data/card-images}
    bucket: ${CARD_IMAGES_S3_BUCKET:}
    region: ${CARD_IMAGES_S3_REGION:us-east-1}
    endpoint: ${CARD_IMAGES_S3_ENDPOINT:}
    prefix: ${CARD_IMAGES_S3_PREFIX:card-images}
    max-bytes: 5242880
    max-edge: 1600
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost,https://localhost,capacitor://localhost,https://zipdeck.app,https://www.zipdeck.app}
