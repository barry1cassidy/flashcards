spring:
  application:
    name: flashcards
  config:
    import:
      - optional:file:./google-sso.yml
      - optional:file:./backend/google-sso.yml
  datasource:
    url: jdbc:mysql://localhost:3306/flashcards?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: flashcards
    password: flashcards
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: local-dev-only-change-me-to-a-long-random-string-32b
    expiration-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
