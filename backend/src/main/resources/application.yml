spring:
  application:
    name: flashcards
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  config:
    import:
      - optional:file:./google-sso.yml
      - optional:file:./backend/google-sso.yml
      - optional:file:./agent.yml
      - optional:file:./backend/agent.yml
  datasource:
    url: jdbc:mysql://localhost:3306/flashcards?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: flashcards
    password: flashcards
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

logging:
  level:
    com.flashcards.agent: INFO

server:
  port: 8080

app:
  jwt:
    secret: local-dev-only-change-me-to-a-long-random-string-32b
    expiration-ms: 86400000
  billing:
    stub-enabled: true
  agent:
    api-key: ${AGENT_API_KEY:}
    base-url: ${AGENT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${AGENT_MODEL:gemini-3.6-flash}
    daily-limit: 10
    max-cards: 40
    timeout-seconds: 90
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost,https://localhost,capacitor://localhost}
